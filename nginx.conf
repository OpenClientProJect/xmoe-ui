server {
    listen 1234;
    server_name 129.204.224.233;
    charset utf-8;
    
    location / {
        #alias /www/LiggAnime/vue/dist/;
        alias /www/xmoe/ui/dist/;
        try_files $uri $uri/ /index.html;
        index index.html index.htm;
    }
    
    location /sk-api/ {
        proxy_pass http://api.xmoe.asia/;
        proxy_set_header x-forwarded-for $remote_addr;
    }
    
    location /xmoe.video/ {
        proxy_pass https://xmoe.video/;
        proxy_set_header x-forwarded-for $remote_addr;
    }
    
    # 添加专门处理 /video-proxy 的路径
    location /video-proxy/ {
        rewrite ^/video-proxy(/.*)$ $1 break;
        proxy_pass https://xmoe.video;
        proxy_set_header Host xmoe.video;
        proxy_set_header Referer https://xmoe.video;
        proxy_set_header Origin https://xmoe.video;
        proxy_set_header x-forwarded-for $remote_addr;
        
        # 添加 CORS 头部
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';
        
        # 处理 OPTIONS 请求
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # 添加一个专门处理不带 / 前缀的 video-proxy 请求
    location = /video-proxy {
        rewrite ^/video-proxy$ / break;
        proxy_pass https://xmoe.video;
        proxy_set_header Host xmoe.video;
        proxy_set_header Referer https://xmoe.video;
        proxy_set_header Origin https://xmoe.video;
        proxy_set_header x-forwarded-for $remote_addr;
        
        # 添加 CORS 头部
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';
        
        # 处理 OPTIONS 请求
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # 添加通用 CORS 代理
    location /cors-proxy {
        # 从查询参数中获取目标 URL
        if ($arg_url) {
            set $proxy_target $arg_url;
            rewrite ^/cors-proxy(.*)$ $proxy_target break;
        }
        
        proxy_pass $proxy_target;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        proxy_set_header Host $proxy_host;
        proxy_set_header Referer $proxy_target;
        proxy_set_header Origin $proxy_target;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 添加 CORS 头部
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;
        
        # 处理预检请求
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        # 错误处理
        proxy_intercept_errors on;
        error_page 301 302 307 = @handle_redirect;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 处理重定向
    location @handle_redirect {
        set $saved_redirect_location '$upstream_http_location';
        proxy_pass $saved_redirect_location;
    }
} 